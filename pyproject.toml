# Release metadata for Comfy Registry / ComfyUI Manager.
# REQUIRED BEFORE PUBLISHING: replace PublisherId with the actual Registry ID.
# The Registry package name "zznodes" is proposed; confirm availability first.
[project]
name = "zznodes"
version = "1.0.0"
description = "ZZNodes tools for ComfyUI: Windows queue-aware shutdown with cancellation and optional diagnostic logging."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "ZZNodes contributors" }]
# Runtime uses aiohttp supplied by ComfyUI; no additional packages are required.
dependencies = []
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/zhangdevops/ComfyUI-ZZNodes"
Documentation = "https://github.com/zhangdevops/ComfyUI-ZZNodes#readme"
"Bug Tracker" = "https://github.com/zhangdevops/ComfyUI-ZZNodes/issues"

[tool.comfy]
PublisherId = "zhang"
DisplayName = "ZZNodes · ComfyUI 工具箱"
